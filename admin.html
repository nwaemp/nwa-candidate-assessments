<script>
const FLOW_URL = "https://defaultb9fe31c2de0742529875da1c500446.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/7b0c2902b6a34df88a3879469437fed0/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=LAbOa6U8xvED2R3HDjai7nhtgI7-u8z5zjhj8Ma-q0E";

const LIKERT = ["Strongly Disagree","Disagree","Neutral","Agree","Strongly Agree"];

// KEEP YOUR EXISTING QS, SECTIONS, DCATS ARRAYS EXACTLY AS THEY ARE.
// Do not delete or modify them.

// STATE
let cand={}, ans={}, curS=0;

// START
function startAssessment() {
  const fn=document.getElementById('i-fn').value.trim();
  const ln=document.getElementById('i-ln').value.trim();
  const em=document.getElementById('i-em').value.trim();

  if(!fn||!ln||!em){
    alert('Please enter your first name, last name, and email.');
    return;
  }

  cand={
    firstName: fn,
    lastName: ln,
    name: fn+' '+ln,
    email: em,
    phone: document.getElementById('i-ph').value.trim(),
    position: document.getElementById('i-pos').value.trim() || 'Administrative Staff',
    date: new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})
  };

  document.getElementById('screen-welcome').style.display='none';
  document.getElementById('screen-assessment').style.display='block';
  document.getElementById('hRight').style.display='flex';
  curS=0;
  renderSec();
}

// RENDER
function renderSec(){
  const sec=SECTIONS[curS],[s,e]=sec.range;
  document.getElementById('sec-tag').textContent=sec.tag;
  document.getElementById('sec-title').textContent=sec.name;
  document.getElementById('sec-sub').textContent=`Questions ${s}–${e} of ${QS.length}`;

  const qs=QS.filter(q=>q.id>=s&&q.id<=e);
  const cont=document.getElementById('q-container');
  cont.innerHTML='';

  qs.forEach((q,i)=>{
    if(i>0){
      const d=document.createElement('div');
      d.className='q-div';
      cont.appendChild(d);
    }

    const b=document.createElement('div');
    b.className='q-block';
    b.style.animationDelay=(i*35)+'ms';
    b.innerHTML=`<div class="q-num">Q${q.id}</div><div class="q-text">${q.q}</div>`;
    b.appendChild(q.t==='l'?mkLikert(q):mkScenario(q));
    cont.appendChild(b);
  });

  document.getElementById('btn-prev').style.display=curS>0?'':'none';
  document.getElementById('btn-next').textContent=curS<SECTIONS.length-1?'Next Section →':'Submit Assessment';
  updateProg();
  window.scrollTo({top:0,behavior:'smooth'});
}

function mkLikert(q){
  const wrap=document.createElement('div');
  const lw=document.createElement('div');
  lw.className='lw';
  lw.id='lw'+q.id;

  LIKERT.forEach(lbl=>{
    const o=document.createElement('div');
    o.className='lo'+(ans[q.id]===lbl?' sel':'');
    o.textContent=lbl;
    o.onclick=()=>{
      lw.querySelectorAll('.lo').forEach(x=>x.classList.remove('sel'));
      o.classList.add('sel');
      ans[q.id]=lbl;
      updateProg();
    };
    lw.appendChild(o);
  });

  const ends=document.createElement('div');
  ends.className='l-ends';
  ends.innerHTML='<span>Strongly Disagree</span><span>Strongly Agree</span>';
  wrap.appendChild(lw);
  wrap.appendChild(ends);
  return wrap;
}

function mkScenario(q){
  const letters=['A','B','C','D'];
  const wrap=document.createElement('div');
  wrap.className='so-wrap';

  q.opts.forEach((txt,i)=>{
    const l=letters[i];
    const o=document.createElement('div');
    o.className='so'+(ans[q.id]===l?' sel':'');
    o.innerHTML=`<div class="so-letter">${l}</div><div class="so-text">${txt}</div>`;
    o.onclick=()=>{
      wrap.querySelectorAll('.so').forEach(x=>x.classList.remove('sel'));
      o.classList.add('sel');
      ans[q.id]=l;
      updateProg();
    };
    wrap.appendChild(o);
  });

  return wrap;
}

function updateProg(){
  const n=Object.keys(ans).length,total=QS.length;
  document.getElementById('prog-num').textContent=n+' / '+total;
  document.getElementById('prog-fill').style.width=Math.round((n/total)*100)+'%';

  const sec=SECTIONS[curS];
  const qs=QS.filter(q=>q.id>=sec.range[0]&&q.id<=sec.range[1]);
  const done=qs.filter(q=>ans[q.id]!==undefined).length;
  document.getElementById('nav-info').textContent=done+' of '+qs.length+' answered';
}

function nextSec(){
  const sec=SECTIONS[curS];
  const missing=QS.filter(q=>q.id>=sec.range[0]&&q.id<=sec.range[1]&&ans[q.id]===undefined);

  if(missing.length){
    alert('Please answer all questions before continuing. ('+missing.length+' remaining)');
    return;
  }

  if(curS<SECTIONS.length-1){
    curS++;
    renderSec();
  } else {
    showResults();
  }
}

function prevSec(){
  if(curS>0){
    curS--;
    renderSec();
  }
}

// SCORING
function scoreQ(q,a){
  if(q.t==='l'){
    const r=LIKERT.indexOf(a)+1;
    return q.rev?(6-r):r;
  }
  return q.sc[a]||0;
}

function computeScores(){
  const grps={};

  QS.forEach(q=>{
    if(q.g==='Validity')return;
    const v=scoreQ(q,ans[q.id]);
    if(!grps[q.g])grps[q.g]=[];
    grps[q.g].push(v);
  });

  const avg={};

  Object.entries(grps).forEach(([g,vals])=>{
    avg[g]=vals.reduce((a,b)=>a+b,0)/vals.length;
  });

  const raw=
    (avg['Integrity']||0)*0.25+
    (avg['Confidentiality']||0)*0.25+
    (avg['Professionalism']||0)*0.20+
    (avg['Reliability']||0)*0.20+
    (avg['Teamwork']||0)*0.15+
    (avg['Situational Judgment']||0)*0.20;

  return{avg,composite:raw/1.25};
}

function getFlags(){
  return QS.filter(q=>q.rf&&q.rf.includes(ans[q.id])).map(q=>({text:q.q,a:ans[q.id]}));
}

function getValidity(){
  return[67,68,69,70].filter(id=>['Agree','Strongly Agree'].includes(ans[id])).length;
}

function getVerdict(c,rf,integrity,conf){
  if(rf>=3||integrity<3.4||conf<3.6)return{label:'Do Not Advance',cls:'vb-no'};
  if(c>=4.2&&rf===0)return{label:'Recommended: Hire',cls:'vb-hire'};
  if(c>=3.8&&rf<=1)return{label:'Hire with Review',cls:'vb-review'};
  if(c>=3.4)return{label:'Review Further',cls:'vb-review'};
  return{label:'Do Not Advance',cls:'vb-no'};
}

// RESULTS
async function showResults(){
  document.getElementById('screen-assessment').style.display='none';
  document.getElementById('screen-results').style.display='block';
  document.getElementById('hRight').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});

  const{avg,composite}=computeScores();
  const flags=getFlags();
  const validity=getValidity();
  const verdict=getVerdict(composite,flags.length,avg['Integrity']||0,avg['Confidentiality']||0);

  const vb=document.getElementById('v-badge');
  vb.textContent=verdict.label;
  vb.className='v-badge '+verdict.cls;

  document.getElementById('r-name').textContent=cand.name;
  document.getElementById('r-meta').textContent=cand.position+' · '+cand.date;
  document.getElementById('r-score').textContent=composite.toFixed(2);

  const grid=document.getElementById('score-grid');
  grid.innerHTML='';

  DCATS.forEach(({key,label})=>{
    const val=avg[key]||0;
    const pct=((val-1)/4)*100;
    const col=val>=4.2?'#2d7a4f':val>=3.4?'#a06020':'#b03030';
    const card=document.createElement('div');
    card.className='sc';
    card.innerHTML=`
      <div class="sc-lbl">${label}</div>
      <div class="sc-bar-w">
        <div class="sc-bar-bg"><div class="sc-bar-fill" style="width:${pct}%;background:${col}"></div></div>
        <div class="sc-val" style="color:${col}">${val.toFixed(1)}</div>
      </div>`;
    grid.appendChild(card);
  });

  if(flags.length>0){
    document.getElementById('flags-box').style.display='block';
    document.getElementById('flags-list').innerHTML=
      flags.map(f=>`<div class="fi">• "${f.text}" — <strong>${f.a}</strong></div>`).join('');
  }

  let sum='';
  if(verdict.cls==='vb-hire')sum='This candidate demonstrates strong alignment with professional ethics, confidentiality standards, and workplace reliability across all measured dimensions.';
  else if(verdict.cls==='vb-review')sum='This candidate shows generally positive work attitudes with some areas warranting closer discussion. Probe any flagged responses and explore reliability and information-handling habits in interview.';
  else sum='This candidate\'s responses indicate concerns in one or more key areas. Review hard-stop criteria and discuss with the hiring manager before advancing.';

  if((avg['Integrity']||0)<3.8)sum+=` Integrity score (${(avg['Integrity']||0).toFixed(1)}) is below target — probe honesty and accuracy habits in interview.`;
  if((avg['Confidentiality']||0)<3.8)sum+=` Confidentiality score (${(avg['Confidentiality']||0).toFixed(1)}) warrants close attention for any role with access to sensitive information.`;
  if((avg['Reliability']||0)<3.5)sum+=` Reliability score (${(avg['Reliability']||0).toFixed(1)}) is low — explore follow-through and error-handling directly.`;
  if(validity>=2)sum+=' Validity check flags suggest possible impression-management responding — interpret all scores with additional caution and probe directly in interview.';

  document.getElementById('sum-box').textContent=sum;

  const mr=avg['Misconduct Risk']||0;
  const report=[
    '=== Administrative Staff Assessment Results ===',
    `Candidate: ${cand.name}`,
    `Email:     ${cand.email}`,
    `Phone:     ${cand.phone||'N/A'}`,
    `Position:  ${cand.position}`,
    `Date:      ${cand.date}`,
    '',
    `RECOMMENDATION: ${verdict.label}`,
    `Weighted Composite Score: ${composite.toFixed(2)} / 5.00`,
    '',
    '--- CATEGORY SCORES ---',
    `Integrity & Honesty:      ${(avg['Integrity']||0).toFixed(2)}`,
    `Confidentiality:          ${(avg['Confidentiality']||0).toFixed(2)}`,
    `Professionalism:          ${(avg['Professionalism']||0).toFixed(2)}`,
    `Reliability:              ${(avg['Reliability']||0).toFixed(2)}`,
    `Teamwork & Communication: ${(avg['Teamwork']||0).toFixed(2)}`,
    `Situational Judgment:     ${(avg['Situational Judgment']||0).toFixed(2)}`,
    `Misconduct Risk:          ${mr.toFixed(2)} (lower = better)`,
    '',
    `Red Flag Count:    ${flags.length}`,
    `Validity Concerns: ${validity}`,
    '',
    '--- SUMMARY ---',
    sum
  ].join('\n');

  document.getElementById('wtext').textContent=report;

  await sendToFlow({
    firstName: cand.firstName,
    lastName: cand.lastName,
    email: cand.email,
    position: cand.position,
    assessmentType: "Admin",
    score: composite.toFixed(2),
    recommendation: verdict.label,
    redFlags: flags.length.toString(),
    report: report
  });
}

async function sendToFlow(data) {
  try {
    await fetch(FLOW_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });
  } catch (e) {
    console.error("Flow submission failed", e);
  }
}

function copyReport(){
  navigator.clipboard.writeText(document.getElementById('wtext').textContent).then(()=>{
    const b=document.querySelector('.btn-cp');
    b.textContent='✓ Copied!';
    setTimeout(()=>b.textContent='Copy to Clipboard',2000);
  });
}
</script>
